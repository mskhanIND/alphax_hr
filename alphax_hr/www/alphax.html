<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'ar' else 'ltr' }}">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0f5132" />
	<title>{{ title }}</title>
	<link rel="icon" href="{{ brand.favicon }}" />
	<link rel="manifest" href="/api/method/alphax_hr.api.branding.manifest" />
	<link rel="apple-touch-icon" href="{{ brand.apple_icon }}" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="{{ title }}" />
	{% for css in entry_css %}<link rel="stylesheet" href="{{ css }}" />{% endfor %}
</head>
<body>
	<div id="root"></div>
	<script>window.ALPHAX_BOOT = {{ boot_json | safe }};</script>
	<script type="module" src="{{ entry_js }}"></script>
</body>
</html>
